[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jiwa-jawa"
version = "1.0.0"
description = "Dam-daman Jawa multiplayer dengan protokol andal di atas UDP"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
docs = ["python-docx>=1.1", "Pillow>=10.0"]

[project.scripts]
jiwa-jawa = "jiwa_jawa.game:main"
jiwa-logger = "jiwa_jawa.raft_logger:main"
jiwa-rating = "jiwa_jawa.rating_cli:main"

[tool.setuptools.packages.find]
include = ["jiwa_jawa*"]
